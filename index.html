<style>

:root[data-theme="dark"]{--bg:#0b1120;--card:#111a2e;--tx:#e8ecf5;--mut:#8b95ab;--bd:#22304a;--ac:#4f9cf9;--acx:#06101f;--hi:#14223d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g2>.card{min-width:0}@media(max-width:760px){.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0;overflow:hidden}.g3>div{padding:14px;border-left:1px solid var(--bd)}.g3>div:first-child{border-left:0}@media(max-width:760px){.g3{grid-template-columns:1fr}.g3>div{border-left:0;border-top:1px solid var(--bd)}}

.gt{position:relative}.gt span{position:absolute;right:6px;font-size:11px;color:var(--mut);transform:translateY(-50%);white-space:nowrap}

.mc{min-height:104px;border:1px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;background:var(--bg);font-size:12px;overflow:hidden}.mc.out{opacity:.45}.mc.tdy{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.mn{font-size:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:2px 0}

.crs{border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}.crs.k{cursor:pointer}.crs.k:hover{border-color:var(--ac)}
.yh{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin:10px 0}.sh{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:12px 0 8px}
.dsb{flex:1;border-radius:0;border:0;border-right:1px solid var(--bd);background:transparent;padding:10px 4px}.dsb b{font-size:18px}.dsb.on{background:var(--hi);color:var(--ac)}
.strip{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--card)}.strip .dsb:last-child{border-right:0}
.trow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}.trow.dn b{text-decoration:line-through;opacity:.55}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--bd);cursor:pointer;border-radius:6px}.lrow:hover{background:var(--hi)}
.wp{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:240px}.wp>div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}.wp .s{font-size:11px;white-space:nowrap}.wb{flex:1;width:100%;background:var(--hi);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.wb i{display:block;width:100%;background:var(--ac);opacity:.55}.wb i.top{opacity:1}
.h0{fill:var(--bd);opacity:.5}.h1{fill:var(--ac);opacity:.3}.h2{fill:var(--ac);opacity:.5}.h3{fill:var(--ac);opacity:.75}.h4{fill:var(--ac)}
.fpr{padding:7px 4px;border-radius:8px;cursor:pointer}.fpr:hover,.fpr.on{background:var(--hi)}
.big2{font-size:30px;font-weight:700;line-height:1.1}

.rc{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin:12px 0}
.un{border-top:1px solid var(--bd);padding:10px 0}

.rvt.over{color:var(--bad);font-weight:700}.rvt.due{color:var(--warn);font-weight:700}
.rcw{background:#0f1729;border-radius:12px;padding:12px;display:grid;place-items:center}#rcv{width:auto;height:auto;max-width:100%;max-height:56vh;border-radius:6px}

.tvc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.big{font-size:min(22vw,24vh);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
#pop{width:min(94vw,470px);padding:20px 22px;border-radius:16px}
.ph{display:flex;gap:12px;align-items:flex-start}
.pic{font-size:20px;width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--hi);flex:none}
.pt{font-size:19px;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.ib{border:0;background:transparent;font-size:18px;padding:4px 8px;color:var(--mut)}.ib:hover{color:var(--tx)}
.pr{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--bd)}.pr:first-of-type{margin-top:18px}
.pi{width:24px;text-align:center;font-size:18px}
.pl{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:700}
.pv{font-size:17px;font-weight:700}.pv.n2{font-weight:400}
.tp select{padding:7px 6px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:70;font-size:13px}
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#auth .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
#auth h1{margin-bottom:4px}#auth form{display:grid;gap:10px;margin-top:14px}#auth input{width:100%}
#auth .lnk{background:none;border:0;color:var(--ac);padding:4px 0;text-align:left}#amsg{min-height:18px;font-size:13px}
#upd{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:380px;width:calc(100% - 32px);padding:18px}#upd::backdrop{background:rgba(0,0,0,.55)}
</style>

<body>
<div id="auth"><div class="box"><h1>📚 Study Track</h1><div class="mut">Your study planner, synced on all your devices.</div>
<div id="aload" class="mut" style="margin-top:14px">Loading…</div>
<form id="aform" hidden><b id="atitle">Sign in</b><input id="aemail" type="email" placeholder="Email" autocomplete="username" required><input id="apw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required minlength="6">
<button class="p" id="abtn" type="submit">Sign in</button><button class="lnk" type="button" id="aswitch"></button><button class="lnk" type="button" id="areset">Forgot password?</button></form>
<div id="amsg"></div></div></div>
<div class="wrap">
 <div class="top">
  <h1>Study Track</h1>
  <div class="tabs"><button data-a="tab" data-v="week">Week</button><button data-a="tab" data-v="day">Day</button><button data-a="tab" data-v="plan">Planning</button><button data-a="tab" data-v="syl">Syllabus</button><button data-a="tab" data-v="fr" data-social hidden>Friends</button><button data-a="tab" data-v="gr" data-social hidden>Groups</button><button data-a="tab" data-v="sr">Revision</button><button data-a="tab" data-v="stats">Stats</button><button data-a="tab" data-v="subs">Subjects and data</button></div>
  <span class="sp"></span><span class="mut" id="sync"></span><span class="mut" id="clk"></span><b id="streak"></b>
  <button data-a="addses">Log session</button><button data-a="addplan">+ Plan</button><button data-a="addtask">+ Task</button><button class="p" data-a="study">Study now</button><button data-a="theme">Theme</button>
 </div>
 <div class="card row" id="nav"><button data-a="today">Today</button><button data-a="prev">‹</button><button data-a="next">›</button><b id="lab"></b></div>
 <div id="main"></div>
</div>

<div id="tv" hidden>
 <div class="row"><div class="row" id="tmodes"><button data-a="tmode" data-v="sw">Stopwatch</button><button data-a="tmode" data-v="cd">Countdown</button><button data-a="tmode" data-v="pomo">Pomodoro</button></div><span class="sp"></span><button data-a="tfs" id="tfs">Full screen</button><button data-a="tx">Close</button></div>
 <div class="tvc">
  <div class="mut" id="tph"></div><div class="big" id="tbig">00:00</div><div class="mut" id="tstud"></div>
  <div class="row" style="justify-content:center"><select id="tsub"></select><select id="tcat"></select><input id="tnote" placeholder="What are you working on?" style="min-width:200px">
   <span id="scd" hidden>Minutes <input id="tcd" type="number" min="1" value="25" style="width:80px"> <button data-a="tadd">+5 min</button></span>
   <span id="spo" hidden>Focus <input id="tf" type="number" min="1" value="25" style="width:70px"> Break <input id="tb" type="number" min="1" value="5" style="width:70px"></span></div>
  <div class="row"><button class="p" data-a="tgo" id="tgo">Start</button><button data-a="tfin">Finish and log</button><button data-a="trs">Discard</button></div>
 </div>
</div>
<dialog id="dlg"><form method="dialog" id="f"></form></dialog>
<dialog id="pop"><div id="pc"></div></dialog>
<input type="file" id="imp" accept=".txt,.json,text/plain,application/json" hidden>
<div id="toast" hidden></div>

<script>
const K="studytracker.v2",MK="studytracker.v3.merged",COL=["#4f46e5","#059669","#d97706","#dc2626","#0891b2","#9333ea","#db2777","#65a30d"],H=48;
const CATS={study:{n:"Study",i:"📖",c:"#3b82f6"},revision:{n:"Revision",i:"🔁",c:"#8b5cf6"},discussion:{n:"Discussion",i:"💬",c:"#14b8a6"}};
const BACKUP={"subs":[],"ses":[],"plans":[]};

const rid=p=>p+Math.random().toString(36).slice(2,9),SRG=[1,3,7,14,30,60];
const subD=s=>{const o=Object.assign({goal:0,sem:1,year:"",exam:"",units:[],marks:{int:[],post:null}},s);
 if(!Array.isArray(o.units))o.units=[];if(!o.marks||!Array.isArray(o.marks.int))o.marks={int:[],post:null};
 if(Array.isArray(s.ch)&&s.ch.length&&!o.units.length)o.units=[{id:rid("u"),t:"Chapters",ch:s.ch.map(c=>({id:rid("c"),t:c.t,d:!!c.d}))}];
 if(s.grade!=null&&!o.marks.post&&!o.marks.int.length)o.marks={int:[],post:{m:+s.grade,x:20}};
 delete o.ch;delete o.sp;delete o.grade;delete o.prev;return o};
const norm=o=>({subs:(o.subs||o.subjects||[]).map(subD),ses:(o.ses||o.sessions||[]).map(s=>Object.assign({},s,{t:s.t!=null?s.t:(s.note||""),cat:CATS[s.cat]?s.cat:"study"})),plans:(o.plans||[]).map(p=>Object.assign({},p,{cat:CATS[p.cat]?p.cat:"study"})),tasks:o.tasks||[],recur:o.recur||[],notes:o.notes||{},goal:o.goal||{d:120,w:840},pass:o.pass||50,profile:o.profile||{name:""},sr:{gaps:(o.sr&&o.sr.gaps&&o.sr.gaps.length==6)?o.sr.gaps:SRG.slice(),items:(o.sr&&o.sr.items)||[]}});
let S=norm({});
try{const raw=localStorage.getItem(K)||localStorage.getItem("studytracker.v1");if(raw)S=norm(JSON.parse(raw))}catch(e){}
function mergeIn(o){const b=norm(o);["subs","ses","plans","tasks","recur"].forEach(k=>{S[k]=S[k]||[];b[k].forEach(x=>{if(!S[k].some(y=>y.id==x.id))S[k].push(x)})});b.sr.items.forEach(x=>{if(!S.sr.items.some(y=>y.id==x.id))S.sr.items.push(x)});Object.keys(b.notes).forEach(k=>{if(!S.notes[k])S.notes[k]=b.notes[k]})}
{let dn=false;try{dn=localStorage.getItem(MK)=="1"}catch(e){}
 if(!dn){mergeIn(BACKUP);try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(MK,"1")}catch(e){}}}

const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,"0"),sum=a=>a.reduce((t,x)=>t+x.min,0);
const mid=d=>{d=new Date(d);d.setHours(0,0,0,0);return d},ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),pd=s=>{const p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])};
const monday=d=>{d=mid(d);return ad(d,-((d.getDay()+6)%7))};
const fd=(d,o)=>{o=o||{};if(o.day&&o.month){const p=n=>String(n).padStart(2,"0"),x=p(d.getDate())+"/"+p(d.getMonth()+1)+(o.year?"/"+d.getFullYear():"");return o.weekday?d.toLocaleDateString(undefined,{weekday:o.weekday})+", "+x:x}return d.toLocaleDateString(undefined,o)},dmy=k=>{const p=k.split("-");return p[2]+"/"+p[1]+"/"+p[0]};
/* 12-hour time helpers */
const t12=(m,p)=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),x=m%60,k=h%12||12;return(p?pad(k):k)+":"+pad(x)+" "+(h<12?"AM":"PM")};
const h12=h=>(h%12||12)+(h<12?" AM":" PM");
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+"h "+m%60+"m":m+"m"};
const fh=h=>h>=10?Math.round(h)+"h":(Math.round(h*10)/10)+"h";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>v===""||v==null?null:+v;
const sub=id=>S.subs.find(s=>s.id==id)||{name:"Deleted",color:"#999",goal:0,sem:1,sp:0,ch:[]};
/* ---- storage: this device always; cloud too when the page runs signed-in on claude.ai ---- */
const AT=K+".at",SY={ref:null,at:0,busy:false,dirty:false,timer:0,st:"local",err:""};
const getAt=()=>{try{return +localStorage.getItem(AT)||0}catch(e){return 0}};
const putLocal=at=>{try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(AT,String(at))}catch(e){}};
function setSt(st,err){SY.st=st;SY.err=err||"";const e=document.getElementById("sync");if(!e)return;
 e.textContent={local:"💾 This device only",syncing:"☁ Saving…",ok:"☁ Synced",err:"⚠ Not synced"}[st];
 e.title={local:"Saved in this browser. Open the shared link signed in to claude.ai to sync across devices.",syncing:"Saving to your private cloud copy",ok:"Saved to your private cloud copy",err:err||"Sync paused; your data is still saved on this device"}[st]}
const save=()=>{lvChk();pubSoon();const t=Date.now();putLocal(t);SY.at=t;if(SY.ref){SY.dirty=true;setSt("syncing");clearTimeout(SY.timer);SY.timer=setTimeout(push,1200)}};
async function push(){if(SY.busy){SY.timer=setTimeout(push,500);return}if(!SY.dirty||!SY.ref)return;SY.busy=true;SY.dirty=false;
 try{await SY.ref.set({json:JSON.stringify(S),at:SY.at});setSt(SY.dirty?"syncing":"ok")}
 catch(e){SY.dirty=true;setSt("err",e&&e.code=="invalid_argument"?"Your access level cannot save to the cloud. Ask the owner to share it with you as Editor.":e&&e.code=="quota_exceeded"?"Cloud storage is full.":"Could not reach the cloud. Will retry on your next change.")}
 SY.busy=false;if(SY.dirty&&SY.st!="err")SY.timer=setTimeout(push,800)}
async function initSync(ref){SY.ref=ref;const snap=await ref.get(),d=snap.exists?snap.data():null,la=getAt();
 if(d&&d.json&&(d.at||0)>la){try{S=norm(JSON.parse(d.json));SY.at=d.at;putLocal(d.at);render()}catch(e){}}
 else if(!d||(d.at||0)<la){SY.at=la||Date.now();SY.dirty=true;await push()}
 else SY.at=la;
 if(SY.st!="err")setSt("ok");
 ref.onSnapshot(sn=>{if(!sn.exists||(sn.metadata&&sn.metadata.hasPendingWrites))return;const x=sn.data();if(!x||!x.json||(x.at||0)<=SY.at||document.getElementById("dlg").open)return;
  try{S=norm(JSON.parse(x.json));SY.at=x.at;putLocal(x.at);render();rp();toast("Updated from another device")}catch(e){}},()=>{})}
function wipeLocal(){S=norm({});try{localStorage.removeItem(K+".gs")}catch(e){}GS={};putLocal(0);SY.ref=null;SY.dirty=false;render()}
(async()=>{try{if(!(window.claude&&claude.use))return;const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;await initSync(db.doc("data/users/"+id+"/state"))}catch(e){}})();

const byDate=l=>{const m={};l.forEach(x=>m[x.date]=(m[x.date]||0)+x.min);return m};

 return `<div class="scroll"><svg viewBox="0 0 ${W} 150" style="width:100%;min-width:${Math.min(W,640)}px">${v.map((x,i)=>{const h=x/mx*95,cx=i*k+k/2;return `<rect x="${i*k+4}" y="${112-h}" width="${k-8}" height="${h}" rx="3" fill="var(--ac)"><title>${lab[i]}: ${Math.round(x)} min</title></rect>${x?`<text x="${cx}" y="${108-h}" text-anchor="middle" font-size="10" fill="var(--tx)">${Math.round(x)}</text>`:""}${i%ev==0?`<text x="${cx}" y="130" text-anchor="middle" font-size="10" fill="var(--mut)">${lab[i]}</text>`:""}`}).join("")}</svg></div>`}

 const hd=`<div class="gh" style="${cols}"><div style="border:0"></div>${ds.map(k=>{const d=pd(k);return `<div class="${k==td?"tdy":""}">${fd(d,{weekday:"short"})} <b style="font-size:18px">${d.getDate()}</b></div>`}).join("")}</div>`;
 const body=`<div class="gs" id="gs"><div class="gb" style="height:${24*H}px;${cols}"><div class="gt">${lab}</div>${ds.map(k=>{
  const b=S.plans.filter(x=>x.date==k).map(x=>{const c=sub(x.subj).color;return blk("plan",x,`border-color:${c};background:${c}2e;color:var(--tx)${x.done?";opacity:.55;text-decoration:line-through":""}`)}).join("")+S.ses.filter(x=>x.date==k&&x.st!=null).map(x=>blk("ses",x,`background:${sub(x.subj).color};opacity:.93`)).join("");
  return `<div class="gc${k==td?" tdy":""}" data-a="slot" data-d="${k}">${b}${k==td?`<div class="now" style="top:${nm/60*H}px"></div>`:""}</div>`}).join("")}</div></div>`;
 return `<div class="scroll"><div style="min-width:${n>1?700:300}px">${hd}${body}</div></div>`}

 nx=S.tasks.filter(x=>!x.done&&!rfar(x)).sort((a,b)=>a.date<b.date?-1:1).slice(0,6),sd=S.sr.items.map(srInfo),sdue=sd.filter(f=>f.st=="due").length,sover=sd.filter(f=>f.st=="over").length;

function wkHit(l){const m={};l.forEach(x=>{const k=iso(monday(pd(x.date)));(m[k]=m[k]||new Set()).add(x.date)});const a=Object.values(m);return[a.filter(s=>s.size>=5).length,a.length]}
function weeklyCard(ss,w){const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],tot=Array(7).fill(0),cnt=Array(7).fill(0);w.ds.forEach(k=>cnt[(pd(k).getDay()+6)%7]++);ss.forEach(x=>tot[(pd(x.date).getDay()+6)%7]+=x.min);

const FPN=[["Consistency","Share of days in this range on which you studied."],["Variety","How many different subjects and activity types (study, revision, discussion) you mix."],["Intensity","Average minutes on the days you study. 3 hours a day counts as 100%."],["Focus","Average session length. Sessions of about 50 minutes or more count as 100%."],["Routine","How steady your first start time is from day to day."]];
function fpDims(ss,w){if(!ss.length)return null;const bd=byDate(ss),days=Object.keys(bd).length,avgD=sum(ss)/days,avgS=sum(ss)/ss.length,sb=new Set(ss.map(x=>x.subj)).size,ct=new Set(ss.map(x=>x.cat)).size,fs={};
 ss.forEach(x=>{if(x.st!=null&&(fs[x.date]==null||x.st<fs[x.date]))fs[x.date]=x.st});const st=Object.values(fs);let rt=.5;
 if(st.length>1){const mu=st.reduce((a,b)=>a+b,0)/st.length,sd=Math.sqrt(st.reduce((a,b)=>a+(b-mu)**2,0)/st.length);rt=Math.max(0,1-sd/180)}
 return[days/w.n,Math.min(1,.6*Math.min(1,sb/3)+.4*ct/3),Math.min(1,avgD/180),Math.min(1,avgS/50),rt]}
function fpCard(ss,w){const d=fpDims(ss,w),BM=[.5,.5,.5,.5,.5],cx=150,cy=135,R=95;
 const pt=(i,v)=>{const a=(-90+i*72)*Math.PI/180;return[(cx+R*v*Math.cos(a)).toFixed(1),(cy+R*v*Math.sin(a)).toFixed(1)]},poly=v=>v.map((x,i)=>pt(i,x).join(",")).join(" ");

 svg+=FPN.map((n,i)=>{const[x,y]=pt(i,1.22);return `<text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="var(--mut)">${n[0]}</text>`}).join("");

 const m=t/6e4,r=Math.floor(m/c),w=m-r*c;return w<x.focus?{k:"f",r:r+1,left:(x.focus-w)*60,ps:x.start+r*c*6e4,pr:w/x.focus}:{k:"b",r:r+1,left:(c-w)*60,ps:x.start+(r*c+x.focus)*6e4,pr:(w-x.focus)/Math.max(1,x.brk)}}

  ${p.k=="up"?`<div style="margin-top:6px">Starts in <b data-cd="${x.id}">${hms(p.left)}</b></div>`:p.k=="done"?"":`<div style="margin-top:6px"><b data-ph="${x.id}">Round ${p.r} of ${x.rounds} · ${p.k=="f"?"Focus":"Break"}</b> · <b data-cd="${x.id}">${hms(p.left)}</b> left</div><div class="pb" style="margin:6px 0 0"><i data-pg="${x.id}" style="width:${Math.round((p.pr||0)*100)}%;background:${p.k=="f"?"var(--ok)":"var(--warn)"}"></i></div>`}
  <div class="mut" style="margin-top:6px">In: ${nm||"nobody yet"}</div>

 function news(){try{var seen=localStorage.getItem("studytracker.seen");localStorage.setItem("studytracker.seen",VER);
  if(seen&&seen!==VER){shown=true;box('<h2 style="margin:0 0 8px">Study Track updated</h2><div class="mut">Version '+VER+'. What is new:</div><ul style="margin:8px 0 0;padding-left:18px">'+NOTES.map(function(n){return"<li>"+n+"</li>"}).join("")+"</ul>",[["Got it",function(){shown=false},1]])}}catch(e){}}
 function chk(){if(shown||!navigator.onLine)return;fetch("index.html",{cache:"no-cache"}).then(function(r){return r.ok?r.text():""}).then(function(t){var m=t.match(/const VER="([^"]+)"/);
  if(m&&m[1]!==VER&&m[1]!==dismissed){shown=true;box('<h2 style="margin:0 0 8px">Update available</h2><div class="mut">A newer version ('+m[1]+') of Study Track is ready. Update now to get the latest features.</div>',[["Later",function(){dismissed=m[1];shown=false}],["Update now",function(){location.reload()},1]])}}).catch(function(){})}
 addEventListener("load",function(){setTimeout(function(){news();chk()},1200);setInterval(chk,5*60*1000)});
 document.addEventListener("visibilitychange",function(){if(document.visibilityState=="visible")chk()});
 if(!("serviceWorker"in navigator)||location.protocol=="file:")return;
 var had=!!navigator.serviceWorker.controller,reg=null;
 window.__refreshApp=function(){var p=[];if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));
  p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));
  Promise.all(p).catch(function(){}).then(function(){location.reload()})};
 navigator.serviceWorker.addEventListener("controllerchange",function(){if(!had){had=true;return}chk()});
 addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){reg=r;r.update().catch(function(){});
  setInterval(function(){r.update().catch(function(){})},5*60*1000)}).catch(function(){})});
 document.addEventListener("visibilitychange",function(){if(document.visibilityState=="visible"&&reg)reg.update().catch(function(){})});
})();
</script>
<script type="module" src="app-sync.js"></script>
</body>
